<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>开火短剧开放平台 - 入驻申请已提交</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .success-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      padding: 20px;
    }
    .success-card {
      background: var(--bg-card);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 60px 48px;
      text-align: center;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(0, 240, 255, 0.1);
      animation: slideUp 0.6s ease;
    }
    .success-card::before {
      content: '';
      position: absolute;
      top: 0; left: 20px; right: 20px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-pink), transparent);
    }
    .success-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(0, 255, 136, 0.1);
      border: 2px solid var(--neon-green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 24px;
      color: var(--neon-green);
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
      animation: scaleIn 0.5s ease;
    }
    @keyframes scaleIn {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .app-id {
      display: inline-block;
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 8px;
      padding: 8px 20px;
      font-family: 'Orbitron', sans-serif;
      font-size: 16px;
      color: var(--neon-cyan);
      margin: 16px 0 24px;
      letter-spacing: 1px;
    }
    .success-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 28px;
    }
  </style>
</head>
<body>
  <div class="success-page">
    <div class="success-card" style="position:relative;">
      <div class="success-icon">&#10003;</div>
      <h1 style="font-size: 24px; margin-bottom: 8px; color: var(--text-primary);">入驻申请已提交</h1>
      <p style="color: var(--text-secondary); font-size: 14px; line-height: 1.6;">
        我们将在 1-3 个工作日内完成审核<br>
        审核结果将通过短信和邮件通知您
      </p>
      <div class="app-id" id="appId">—</div>
      <div class="success-actions">
        <a href="index.html" class="btn btn-gradient" style="display:flex;justify-content:center;align-items:center;">返回登录页</a>
        <button class="btn" onclick="alert('申请进度查询功能即将上线')">查看申请进度</button>
      </div>
    </div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var id = params.get('id') || 'KH' + new Date().toISOString().slice(0,10).replace(/-/g,'') + '001';
    document.getElementById('appId').textContent = id;
  </script>
</body>
</html>
