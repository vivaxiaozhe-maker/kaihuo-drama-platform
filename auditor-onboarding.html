<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>开火短剧开放平台 - 入驻申请管理</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/data.js"></script>
</head>
<body>
  <header class="header">
    <canvas id="headerCanvas" class="header-bg"></canvas>
    <div class="header-left">
      <span class="header-logo">&#128293;</span>
      <span class="header-title">开火短剧开放平台</span>
    </div>
    <div class="header-right">
      <span id="roleTag" class="role-tag auditor">审核人</span>
      <span id="userName" class="user-name">李审核</span>
      <button class="btn-logout" onclick="logout()">退出</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sider">
      <ul class="sider-menu">
        <li><a href="submitter.html">&#127909; 我的提报</a></li>
        <li><a href="submitter.html?tab=upload">&#128316; 上传新剧</a></li>
        <li><a href="auditor.html">&#128270; 剧集审核</a></li>
        <li><a href="auditor-onboarding.html" class="active">&#128196; 入驻管理</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <h1 class="page-title">入驻申请管理</h1>
      <p class="page-subtitle">合作伙伴入驻申请审核与管理</p>

      <!-- 筛选区 -->
      <div class="card">
        <div class="search-bar">
          <input type="text" id="filterId" class="input" placeholder="申请编号..." style="width: 180px;">
          <input type="text" id="filterCompany" class="input" placeholder="企业名称..." style="width: 200px;">
          <select id="filterStatus" class="select" style="width: 140px;">
            <option value="all">全部状态</option>
            <option value="pending">待审核</option>
            <option value="reviewing">审核中</option>
            <option value="approved">已通过</option>
            <option value="rejected">已拒绝</option>
          </select>
          <button class="btn" onclick="resetFilter()">重置</button>
          <button class="btn btn-primary" onclick="renderTable()">查询</button>
        </div>
      </div>

      <!-- 列表 -->
      <div class="card">
        <table class="table" id="onboardingTable">
          <thead>
            <tr>
              <th>申请编号</th>
              <th>企业名称</th>
              <th style="width:160px">统一社会信用代码</th>
              <th style="width:140px">合作业务类型</th>
              <th style="width:140px">对接人</th>
              <th style="width:160px">申请时间</th>
              <th style="width:100px">审核状态</th>
              <th style="width:140px">操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div id="emptyState" class="empty" style="display:none">暂无入驻申请</div>
      </div>
    </main>
  </div>

  <!-- 入驻审核弹窗 -->
  <div class="modal-overlay" id="auditModal">
    <div class="modal" style="max-width:800px; max-height:90vh; overflow-y:auto;">
      <div class="modal-header">
        <h3 id="auditModalTitle" style="color:var(--neon-cyan)">入驻审核</h3>
        <button class="modal-close" onclick="closeAuditModal()">&times;</button>
      </div>
      <div class="modal-body" id="auditBody"></div>
    </div>
  </div>

  <script>
    (function() {
      var canvas = document.getElementById('headerCanvas');
      var ctx = canvas.getContext('2d');
      var particles = [];
      function resize() { canvas.width = canvas.parentElement.offsetWidth; canvas.height = canvas.parentElement.offsetHeight; }
      resize(); window.addEventListener('resize', resize);
      for (var i = 0; i < 40; i++) particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5, radius: Math.random() * 1.5 + 0.5 });
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i]; p.x += p.vx; p.y += p.vy;
          if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
          if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0, 240, 255, 0.4)'; ctx.fill();
          for (var j = i + 1; j < particles.length; j++) {
            var p2 = particles[j]; var dx = p.x - p2.x, dy = p.y - p2.y; var dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 100) { ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.strokeStyle = 'rgba(0, 240, 255, ' + (0.2 * (1 - dist / 100)) + ')'; ctx.lineWidth = 0.5; ctx.stroke(); }
          }
        }
        requestAnimationFrame(animate);
      }
      animate();
    })();

    var user = window.MOCK.getUser();
    if (!user) { window.location.href = 'index.html'; }
    else {
      document.getElementById('roleTag').textContent = user.role === 'auditor' ? '审核人' : '提报人';
      document.getElementById('roleTag').className = 'role-tag' + (user.role === 'auditor' ? ' auditor' : '');
      document.getElementById('userName').textContent = user.displayName;
    }
    function logout() { window.MOCK.logout(); window.location.href = 'index.html'; }

    var apps = window.MOCK.onboardingApplications;
    var currentAppId = null;
    var resultOptions = ['S级', 'A+级', 'A级', 'B级', '不通过'];

    var statusMap = {
      pending: { label: '待审核', color: '#8c8c8c' },
      reviewing: { label: '审核中', color: '#1890ff' },
      approved: { label: '已通过', color: '#52c41a' },
      rejected: { label: '已拒绝', color: '#ff4d4f' }
    };

    function maskCode(code) {
      if (!code || code.length < 8) return code;
      return code.slice(0, 4) + '****' + code.slice(-4);
    }

    function renderTable() {
      var idFilter = document.getElementById('filterId').value.trim();
      var companyFilter = document.getElementById('filterCompany').value.trim();
      var statusFilter = document.getElementById('filterStatus').value;

      var list = apps.filter(function(a) {
        if (idFilter && a.id.indexOf(idFilter) === -1) return false;
        if (companyFilter && a.companyName.indexOf(companyFilter) === -1) return false;
        if (statusFilter !== 'all' && a.status !== statusFilter) return false;
        return true;
      });

      var tbody = document.querySelector('#onboardingTable tbody');
      var empty = document.getElementById('emptyState');

      if (list.length === 0) {
        tbody.innerHTML = '';
        empty.style.display = 'block';
        document.getElementById('onboardingTable').style.display = 'none';
        return;
      }
      document.getElementById('onboardingTable').style.display = 'table';
      empty.style.display = 'none';

      tbody.innerHTML = list.map(function(a) {
        var s = statusMap[a.status] || statusMap.pending;
        var bizTags = a.businessTypes.map(function(t) {
          return '<span class="tag-result" style="background:rgba(0,240,255,0.08);color:var(--neon-cyan);border:1px solid rgba(0,240,255,0.2);margin-right:4px;font-size:11px">' + t + '</span>';
        }).join('');
        var canAudit = a.status === 'pending' || a.status === 'reviewing';
        return '<tr>' +
          '<td style="font-family:Orbitron,sans-serif;font-size:13px">' + a.id + '</td>' +
          '<td>' + a.companyName + '</td>' +
          '<td>' + maskCode(a.unifiedSocialCode) + '</td>' +
          '<td>' + bizTags + '</td>' +
          '<td>' + a.contactPerson.name + '<br><span style="font-size:12px;color:var(--text-secondary)">' + a.contactPerson.phone + '</span></td>' +
          '<td>' + a.createdAt + '</td>' +
          '<td><span class="tag-result" style="background:' + s.color + '22;color:' + s.color + ';border:1px solid ' + s.color + '66">' + s.label + '</span></td>' +
          '<td>' +
            (canAudit ? '<button class="btn btn-sm btn-primary" onclick="openAuditModal(\'' + a.id + '\')">审核</button> ' : '') +
            '<button class="btn btn-sm" style="color:var(--neon-cyan);border-color:rgba(0,240,255,0.3)" onclick="openDetailModal(\'' + a.id + '\')">详情</button>' +
          '</td>' +
        '</tr>';
      }).join('');
    }

    function resetFilter() {
      document.getElementById('filterId').value = '';
      document.getElementById('filterCompany').value = '';
      document.getElementById('filterStatus').value = 'all';
      renderTable();
    }

    function openAuditModal(appId) {
      currentAppId = appId;
      var app = apps.find(function(a) { return a.id === appId; });
      if (!app) return;
      renderAuditModal(app, true);
    }

    function openDetailModal(appId) {
      currentAppId = appId;
      var app = apps.find(function(a) { return a.id === appId; });
      if (!app) return;
      renderAuditModal(app, false);
    }

    function renderAuditModal(app, editable) {
      var s = statusMap[app.status] || statusMap.pending;
      document.getElementById('auditModalTitle').innerHTML = '入驻审核 - <span style="color:var(--text-primary);font-size:16px">' + app.companyName + '</span>';

      var tabLabels = ['企业信息', '联系人', '业务能力'];
      var html = '<div style="display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border-color)">' +
        tabLabels.map(function(l, idx) {
          return '<div class="audit-tab-item' + (idx === 0 ? ' active' : '') + '" style="padding:10px 16px;cursor:pointer;color:var(--text-secondary);font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.3s;" onclick="switchAuditTab(this,' + idx + ')">' + l + '</div>';
        }).join('') + '</div>';

      // Tab1: 企业信息
      html += '<div class="audit-tab" data-idx="0" style="display:block">' +
        '<div class="summary-card" style="margin-bottom:16px">' +
          '<div class="summary-row"><span class="summary-label">申请编号</span><span class="summary-value" style="font-family:Orbitron">' + app.id + '</span></div>' +
          '<div class="summary-row"><span class="summary-label">企业名称</span><span class="summary-value">' + app.companyName + '</span></div>' +
          '<div class="summary-row"><span class="summary-label">统一社会信用代码</span><span class="summary-value">' + app.unifiedSocialCode + '</span></div>' +
          '<div class="summary-row"><span class="summary-label">企业类型</span><span class="summary-value">' + app.companyType + '</span></div>' +
          '<div class="summary-row"><span class="summary-label">成立时间</span><span class="summary-value">' + (app.establishedAt || '—') + '</span></div>' +
          '<div class="summary-row"><span class="summary-label">注册地址</span><span class="summary-value">' + (app.registeredAddress || '—') + '</span></div>' +
          '<div class="summary-row"><span class="summary-label">办公地址</span><span class="summary-value">' + (app.officeAddress || '—') + '</span></div>' +
        '</div>' +
        '<div class="summary-card">' +
          '<h4 style="font-size:14px;color:var(--neon-cyan);margin-bottom:12px">营业执照</h4>' +
          '<div style="width:200px;height:120px;background:rgba(0,240,255,0.05);border:1px solid var(--border-color);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--neon-cyan)">&#128196;</div>' +
        '</div>' +
      '</div>';

      // Tab2: 联系人
      html += '<div class="audit-tab" data-idx="1" style="display:none">' +
        '<div class="section-title" style="margin-top:0">对接人信息</div>' +
        '<div class="summary-card" style="margin-bottom:16px">' +
          '<div class="summary-row"><span class="summary-label">姓名</span><span class="summary-value">' + app.contactPerson.name + '</span></div>' +
          '<div class="summary-row"><span class="summary-label">手机号</span><span class="summary-value">' + app.contactPerson.phone + '</span></div>' +
          '<div class="summary-row"><span class="summary-label">邮箱</span><span class="summary-value">' + app.contactPerson.email + '</span></div>' +
          '<div class="summary-row"><span class="summary-label">职务</span><span class="summary-value">' + (app.contactPerson.position || '—') + '</span></div>' +
        '</div>' +
        '<div class="section-title">法定代表人信息</div>' +
        '<div class="summary-card">' +
          '<div class="summary-row"><span class="summary-label">姓名</span><span class="summary-value">' + app.legalRepresentative.name + '</span></div>' +
          '<div class="summary-row"><span class="summary-label">手机号</span><span class="summary-value">' + app.legalRepresentative.phone + '</span></div>' +
          '<div class="summary-row"><span class="summary-label">身份证号</span><span class="summary-value">' + maskCode(app.legalRepresentative.idCard) + '</span></div>' +
          '<div class="summary-row"><span class="summary-label">邮箱</span><span class="summary-value">' + (app.legalRepresentative.email || '—') + '</span></div>' +
        '</div>' +
      '</div>';

      // Tab3: 业务能力
      var worksHtml = '';
      if (app.hasPreviousWorks && app.previousWorks && app.previousWorks.length) {
        worksHtml = '<table class="works-table" style="margin-top:12px"><thead><tr><th>作品名称</th><th>平台</th><th>集数</th><th>类型</th></tr></thead><tbody>' +
          app.previousWorks.map(function(w) {
            return '<tr><td>' + w.name + '</td><td>' + w.platform + '</td><td>' + w.episodes + '</td><td>' + w.type + '</td></tr>';
          }).join('') + '</tbody></table>';
      } else {
        worksHtml = '<div class="empty" style="padding:20px">暂无过往作品</div>';
      }

      html += '<div class="audit-tab" data-idx="2" style="display:none">' +
        '<div class="summary-card" style="margin-bottom:16px">' +
          '<div class="summary-row"><span class="summary-label">合作业务类型</span><span class="summary-value">' + app.businessTypes.join('、') + '</span></div>' +
          '<div class="summary-row"><span class="summary-label">内容类型偏好</span><span class="summary-value">' + (app.contentTypePreference ? app.contentTypePreference.join('、') : '—') + '</span></div>' +
          '<div class="summary-row"><span class="summary-label">男女频偏好</span><span class="summary-value">' + (app.genderPreference || '—') + '</span></div>' +
          '<div class="summary-row"><span class="summary-label">擅长题材</span><span class="summary-value">' + (app.genreSpecialty ? app.genreSpecialty.join('、') : '—') + '</span></div>' +
        '</div>' +
        '<div class="summary-card" style="margin-bottom:16px">' +
          '<h4 style="font-size:14px;color:var(--neon-cyan);margin-bottom:12px">资质证书</h4>' +
          '<div class="summary-row"><span class="summary-label">广播电视节目制作经营许可证</span><span class="summary-value">' + (app.hasBroadcastLicense ? '有（' + app.broadcastLicenseNo + '）' : '无') + '</span></div>' +
          '<div class="summary-row"><span class="summary-label">网络文化经营许可证</span><span class="summary-value">' + (app.hasNetCultureLicense ? '有' : '无') + '</span></div>' +
          '<div class="summary-row"><span class="summary-label">其他资质</span><span class="summary-value">' + (app.otherQualifications || '—') + '</span></div>' +
        '</div>' +
        '<div class="summary-card">' +
          '<h4 style="font-size:14px;color:var(--neon-cyan);margin-bottom:12px">过往作品</h4>' + worksHtml +
        '</div>' +
      '</div>';

      // 审核操作区
      if (editable && (app.status === 'pending' || app.status === 'reviewing')) {
        html += '<div style="border-top:1px solid var(--border-color);padding-top:20px;margin-top:20px">' +
          '<h4 style="font-size:14px;color:var(--neon-pink);margin-bottom:16px">审核操作</h4>' +
          '<form id="onboardingAuditForm">' +
            '<div class="form-group"><label class="form-label">审核结果 <span style="color:var(--neon-red)">*</span></label>' +
            '<div class="radio-group">' +
              '<label class="radio-item" style="border-color:rgba(0,255,136,0.4);color:var(--neon-green)"><input type="radio" name="auditResult" value="approved" required style="margin-right:6px"> 通过</label>' +
              '<label class="radio-item" style="border-color:rgba(255,77,79,0.4);color:var(--neon-red)"><input type="radio" name="auditResult" value="rejected" required style="margin-right:6px"> 拒绝</label>' +
            '</div></div>' +
            '<div class="form-group"><label class="form-label">审核意见 <span style="color:var(--neon-red)">*</span></label>' +
            '<textarea name="auditOpinion" class="form-input" rows="3" placeholder="请输入审核意见..." required></textarea></div>' +
            '<div id="rejectReasonDiv" style="display:none;">' +
              '<div class="form-group"><label class="form-label">拒绝原因</label>' +
              '<select name="rejectReason" class="select" style="width:100%;max-width:300px">' +
                '<option value="资质不全">资质不全</option>' +
                '<option value="内容不符">内容不符</option>' +
                '<option value="重复申请">重复申请</option>' +
                '<option value="其他">其他</option>' +
              '</select></div>' +
            '</div>' +
            '<div style="text-align:right">' +
              '<button type="button" class="btn" onclick="closeAuditModal()" style="margin-right:8px">取消</button>' +
              '<button type="submit" class="btn btn-primary">确认审核</button>' +
            '</div>' +
          '</form></div>';
      } else if (app.status === 'approved' || app.status === 'rejected') {
        html += '<div style="border-top:1px solid var(--border-color);padding-top:20px;margin-top:20px">' +
          '<h4 style="font-size:14px;color:var(--neon-cyan);margin-bottom:12px">审核结果</h4>' +
          '<div class="summary-card">' +
            '<div class="summary-row"><span class="summary-label">审核结果</span><span class="summary-value" style="color:' + (app.auditResult === 'approved' ? 'var(--neon-green)' : 'var(--neon-red)') + '">' + (app.auditResult === 'approved' ? '已通过' : '已拒绝') + '</span></div>' +
            '<div class="summary-row"><span class="summary-label">审核意见</span><span class="summary-value">' + (app.auditOpinion || '—') + '</span></div>' +
            (app.rejectReason ? '<div class="summary-row"><span class="summary-label">拒绝原因</span><span class="summary-value">' + app.rejectReason + '</span></div>' : '') +
            '<div class="summary-row"><span class="summary-label">审核时间</span><span class="summary-value">' + (app.reviewedAt || '—') + '</span></div>' +
            (app.accountGenerated ? '<div class="summary-row"><span class="summary-label">已生成账号</span><span class="summary-value" style="color:var(--neon-green)">是（' + app.accountUsername + '）</span></div>' : '') +
          '</div></div>';
      }

      document.getElementById('auditBody').innerHTML = html;
      document.getElementById('auditModal').classList.add('active');

      // 拒绝原因联动
      var rejectDiv = document.getElementById('rejectReasonDiv');
      if (rejectDiv) {
        document.querySelectorAll('input[name="auditResult"]').forEach(function(r) {
          r.addEventListener('change', function() {
            rejectDiv.style.display = this.value === 'rejected' ? 'block' : 'none';
          });
        });
      }

      // 表单提交
      var form = document.getElementById('onboardingAuditForm');
      if (form) {
        form.addEventListener('submit', function(e) {
          e.preventDefault();
          var result = e.target.auditResult.value;
          var opinion = e.target.auditOpinion.value;
          var idx = apps.findIndex(function(a) { return a.id === currentAppId; });
          if (idx !== -1) {
            apps[idx].status = result;
            apps[idx].auditResult = result;
            apps[idx].auditOpinion = opinion;
            if (result === 'rejected') {
              var rr = e.target.rejectReason;
              apps[idx].rejectReason = rr ? rr.value : '其他';
            } else {
              apps[idx].accountGenerated = true;
              apps[idx].accountUsername = apps[idx].unifiedSocialCode;
            }
            apps[idx].reviewerId = 'u2';
            apps[idx].reviewedAt = new Date().toISOString().replace('T', ' ').slice(0, 19);
            apps[idx].updatedAt = apps[idx].reviewedAt;
          }
          alert(result === 'approved' ? '审核已通过，已生成企业账号' : '审核已拒绝');
          closeAuditModal();
          renderTable();
        });
      }
    }

    function switchAuditTab(el, idx) {
      document.querySelectorAll('.audit-tab-item').forEach(function(t) { t.style.color = 'var(--text-secondary)'; t.style.borderBottomColor = 'transparent'; t.style.textShadow = 'none'; });
      el.style.color = 'var(--neon-cyan)';
      el.style.borderBottomColor = 'var(--neon-cyan)';
      el.style.textShadow = '0 0 10px rgba(0, 240, 255, 0.5)';
      document.querySelectorAll('.audit-tab').forEach(function(t) { t.style.display = 'none'; });
      document.querySelector('.audit-tab[data-idx="' + idx + '"]').style.display = 'block';
    }

    function closeAuditModal() {
      document.getElementById('auditModal').classList.remove('active');
      currentAppId = null;
    }

    renderTable();
  </script>
</body>
</html>
